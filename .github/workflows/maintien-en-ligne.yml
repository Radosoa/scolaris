# Démo en ligne : interroge l'API toutes les 6 heures pour que la base MySQL gratuite (Aiven)
# ne soit pas éteinte pour inactivité. Fréquence volontairement basse : les heures gratuites
# de Render sont partagées entre tous les services du compte.
name: Maintien en ligne de la démo

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ vars.SCOLARIS_API_URL || 'https://scolaris-api-sco9.onrender.com' }}
    steps:
      - name: Réveiller l'API et lire la base de l'école de démo
        run: |
          # Premier appel : l'API gratuite peut mettre ~1 min à sortir de veille
          for essai in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 -H 'Accept: application/json' -H 'X-Ecole: demo' "$API_URL/api/ecole" || true)
            echo "Essai $essai : HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "::error::L'API ou la base ne répond pas : vérifier Render et Aiven (service éteint ?)"
          exit 1
